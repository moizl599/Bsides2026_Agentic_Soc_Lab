# TheHive 5 — Lab Configuration
# Cassandra + MinIO, no search index (not needed for demo-scale data)

db.janusgraph {
  storage {
    backend = cql
    hostname = ["cassandra"]
    cql {
      cluster-name = thehive
      keyspace = thehive
    }
  }
}

storage {
  provider = s3
  s3 {
    bucket = "thehive"
    readTimeout = 1 minute
    writeTimeout = 1 minute
    chunkSize = 1 MB
    endpoint = "http://minio:9000"
    accessKey = "minioadmin"
    secretKey = "minioadmin"
    region = "us-east-1"
  }
}

play.http.secret.key = "bsides-lab-secret-change-in-prod"

cortex {
  servers = []
}
